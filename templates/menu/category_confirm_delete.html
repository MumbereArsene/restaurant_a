{% extends "staff_base.html" %}
{% load i18n %}

{% block content %}
<div class="mb-6"><h1 class="font-display text-3xl font-bold tracking-tight">{% trans "Supprimer" %} « {{ category.name_fr }} »</h1></div>
<p class="text-ink-soft">{% trans "Tous les plats de cette catégorie seront aussi supprimés." %}</p>
<form method="post" class="mt-6 flex gap-2">
  {% csrf_token %}
  <button type="submit" class="btn-danger">{% trans "Oui, supprimer" %}</button>
  <a href="{% url 'menu:staff' %}" class="btn-ghost">{% trans "Annuler" %}</a>
</form>
{% endblock %}

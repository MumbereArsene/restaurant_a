{% load i18n cart_tags %}
{% with qty=cart|cart_qty:dish.pk prefix=qty_prefix|default:"qty" %}
<div id="{{ prefix }}-{{ dish.pk }}" class="flex items-center gap-1" {% if oob %}hx-swap-oob="true"{% endif %}>
  {% if qty %}
    <form hx-post="{% url 'orders:cart_update' %}" hx-target="#cart-live" hx-swap="none" class="contents">
      {% csrf_token %}
      <input type="hidden" name="dish_id" value="{{ dish.pk }}">
      <input type="hidden" name="action" value="dec">
      <button type="submit"
              class="flex h-8 w-8 items-center justify-center rounded-full border border-line bg-white text-sm font-bold transition hover:border-ink active:scale-95"
              aria-label="{% trans 'Retirer' %}">−</button>
    </form>
    <span class="min-w-6 text-center text-sm font-extrabold tabular-nums">{{ qty }}</span>
    <form hx-post="{% url 'orders:cart_update' %}" hx-target="#cart-live" hx-swap="none" class="contents">
      {% csrf_token %}
      <input type="hidden" name="dish_id" value="{{ dish.pk }}">
      <input type="hidden" name="action" value="inc">
      <button type="submit"
              class="flex h-8 w-8 items-center justify-center rounded-full bg-vermilion text-sm font-extrabold text-ink transition hover:bg-vermilion-dark active:scale-95"
              aria-label="{% trans 'Ajouter' %}">+</button>
    </form>
  {% else %}
    <form hx-post="{% url 'orders:cart_add' %}" hx-target="#cart-live" hx-swap="none" class="contents">
      {% csrf_token %}
      <input type="hidden" name="dish_id" value="{{ dish.pk }}">
      <button type="submit"
              class="rounded-full bg-vermilion px-3.5 py-1.5 text-xs font-extrabold text-ink transition hover:bg-vermilion-dark active:scale-95">
        + {% trans "Ajouter" %}
      </button>
    </form>
  {% endif %}
</div>
{% endwith %}
